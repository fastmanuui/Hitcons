<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hit Coins 2 — UI Prototype</title>
<link rel="stylesheet" href="style.css?v=hc2-ui-improvements-2">

<!-- Critical splash layout is inline so it still works if a host/browser serves an older cached stylesheet. -->
<style id="critical-startup-layout">
/* Critical splash so the loading screen looks polished even if the main stylesheet is cached or delayed */
html,body{margin:0;min-height:100%;width:100%;}
body{overflow:hidden;}
.startup-screen{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;height:100dvh!important;box-sizing:border-box!important;z-index:2147483647!important;display:grid!important;place-items:center!important;overflow-y:auto!important;overflow-x:hidden!important;padding:24px!important;background:radial-gradient(ellipse at 50% 28%,#5b1743 0%,#26091f 38%,#100611 76%,#080409 100%)!important;color:#fff!important;font-family:Arial,Helvetica,sans-serif!important;isolation:isolate!important;}
.startup-screen[hidden],.startup-retry[hidden]{display:none!important}
.startup-screen:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.22;background-image:linear-gradient(#ffd76a0d 1px,transparent 1px),linear-gradient(90deg,#ffd76a0d 1px,transparent 1px);background-size:44px 44px}
.startup-screen:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,#0009 100%)}
.startup-content{position:relative;z-index:1;width:min(100%,390px);margin:auto;box-sizing:border-box;text-align:center}
.game{visibility:hidden!important}
body.game-ready .game{visibility:visible!important}
@media(max-height:650px){.startup-screen{padding:14px!important}.startup-content{max-width:340px}}
/* Decorative pieces that must appear even before full CSS loads */
.startup-orb{position:absolute;border-radius:50%;pointer-events:none;filter:blur(40px);opacity:.55}
.startup-orb-one{width:min(70vw,320px);height:min(70vw,320px);top:-8%;left:-12%;background:radial-gradient(circle,#ff4f9a88,#ff4f9a00 70%)}
.startup-orb-two{width:min(55vw,260px);height:min(55vw,260px);bottom:5%;right:-10%;background:radial-gradient(circle,#ffd24a66,#ffd24a00 70%)}
.startup-emblem{position:relative;width:110px;height:110px;margin:0 auto 14px;display:grid;place-items:center}
.startup-crown{font-size:64px;line-height:1;color:#ffd24a;filter:drop-shadow(0 0 18px #ffd24a88) drop-shadow(0 4px 0 #5a002e);animation:startupCrown 2.8s ease-in-out infinite}
.startup-coin{position:absolute;font-size:22px;color:#ffe27a;text-shadow:0 0 10px #ffd24a}
.startup-coin-a{top:8px;right:6px;animation:startupCoin 2.2s ease-in-out infinite}
.startup-coin-b{bottom:10px;left:4px;animation:startupCoin 2.2s ease-in-out infinite .6s}
.startup-eyebrow{font-size:11px;font-weight:900;letter-spacing:.28em;color:#ffb3d4;margin-bottom:6px;text-transform:uppercase}
.startup-content h1{margin:0 0 6px;font-size:clamp(34px,9vw,48px);font-weight:1000;letter-spacing:.04em;color:#fff;text-shadow:0 3px 0 #7a0038,0 0 24px #ff2b9788}
.startup-content h1 span{color:#ffd24a;text-shadow:0 3px 0 #7a0038,0 0 20px #ffd24a99}
.startup-tagline{margin:0 0 22px;font-size:14px;color:#ffd0e6;opacity:.9}
.startup-progress-track{height:10px;border-radius:99px;background:#1a0612;border:1px solid #ffcf5255;overflow:hidden;box-shadow:inset 0 1px 4px #000a}
.startup-progress-fill{height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#ff9acb,#ffd24a 55%,#ffe27a);box-shadow:0 0 12px #ffd24a88;transition:width .35s ease}
.startup-progress-meta{display:flex;justify-content:space-between;align-items:center;margin:8px 0 18px;font-size:12px;color:#ffd0e6}
.startup-progress-meta strong{color:#ffd24a;font-variant-numeric:tabular-nums}
.startup-checks{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;text-align:left}
.startup-check{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:1px solid #ffcf5244;background:rgba(0,0,0,.28);backdrop-filter:blur(6px)}
.startup-check-icon{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px;background:#3a0a20;color:#ffb3d4;flex:none}
.startup-check.is-ready .startup-check-icon{background:linear-gradient(#17b86a,#087a43);color:#fff}
.startup-check.is-error .startup-check-icon{background:linear-gradient(#e04040,#8a1010);color:#fff}
.startup-check b{display:block;font-size:13px;color:#fff}
.startup-check small{display:block;font-size:11px;color:#ffd0e6;opacity:.85;margin-top:2px}
.startup-check em{margin-left:auto;font-style:normal;font-size:10px;font-weight:900;letter-spacing:.06em;color:#ffb3d4}
.startup-check.is-ready em{color:#7dffb3}
.startup-check.is-error em{color:#ff9a9a}
.startup-footer{font-size:11px;font-weight:800;letter-spacing:.12em;color:#ffb3d4;opacity:.9}
.startup-pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ffd24a;margin-right:8px;box-shadow:0 0 10px #ffd24a;animation:startupPulse 1.4s ease-in-out infinite}
.startup-retry{margin-top:16px;min-height:44px;padding:0 22px;border-radius:12px;border:2px solid #ffd24a;background:linear-gradient(180deg,#ff63bb,#8a0054);color:#fff;font-weight:900;font-size:14px;cursor:pointer}
.startup-screen.is-leaving{opacity:0;transform:scale(1.03);transition:opacity .55s ease,transform .55s ease;pointer-events:none}
@keyframes startupCrown{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes startupCoin{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.15);opacity:1}}
@keyframes startupPulse{0%,100%{opacity:.5;transform:scale(.9)}50%{opacity:1;transform:scale(1.15)}}
</style>


</head>
<body>
<!-- Shared gradients for the control-button icons -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7b8"/>
      <stop offset=".5" stop-color="#ffd24a"/>
      <stop offset="1" stop-color="#e08a00"/>
    </linearGradient>
  </defs>
</svg>

<!-- Startup gate: the game stays covered until assets are decoded and Socket.IO is connected. -->
<section class="startup-screen" id="startupScreen" role="status" aria-live="polite" aria-label="Loading Hit Coins 2">
  <div class="startup-orb startup-orb-one"></div><div class="startup-orb startup-orb-two"></div>
  <div class="startup-content">
    <div class="startup-emblem"><span class="startup-crown">♛</span><span class="startup-coin startup-coin-a">✦</span><span class="startup-coin startup-coin-b">✦</span></div>
    <div class="startup-eyebrow">THE GOLDEN REELS</div>
    <h1>HIT COINS <span>2</span></h1>
    <p class="startup-tagline">Fortune is getting ready.</p>
    <div class="startup-progress-track"><div class="startup-progress-fill" id="startupProgressFill"></div></div>
    <div class="startup-progress-meta"><span id="startupProgressLabel">Preparing your game…</span><strong id="startupProgressPercent">0%</strong></div>
    <div class="startup-checks">
      <div class="startup-check" id="startupAssetsCheck"><span class="startup-check-icon">◌</span><span><b>Game assets</b><small id="startupAssetsDetail">Loading and decoding graphics</small></span><em>WAITING</em></div>
      <div class="startup-check" id="startupServerCheck"><span class="startup-check-icon">◌</span><span><b>Live server</b><small id="startupServerDetail">Connecting securely to the game</small></span><em>CONNECTING</em></div>
    </div>
    <div class="startup-footer"><span class="startup-pulse"></span> YOUR GAME WILL OPEN AUTOMATICALLY WHEN READY</div>
    <button class="startup-retry" id="startupRetry" type="button" hidden>Retry loading</button>
  </div>
</section>

<main class="game" aria-label="Hit Coins game interface">
  <div class="reel-frame">
    <div class="reels" id="reels">
      <div class="reel" data-reel="0"><div class="symbols"></div></div>
      <div class="reel" data-reel="1"><div class="symbols"></div></div>
      <div class="reel" data-reel="2"><div class="symbols"></div></div>
    </div>
  </div>

  <div class="win-banner" id="winBanner" aria-live="polite"></div>
  <div class="controls">
    <!-- Settings -->
    <button class="ctl side-btn menu" id="menu" aria-label="Settings">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
        <g fill="url(#goldGrad)" stroke="#8a4300" stroke-width=".6" stroke-linejoin="round">
          <rect x="10.3" y="1.6" width="3.4" height="5" rx="1"/>
          <rect x="10.3" y="1.6" width="3.4" height="5" rx="1" transform="rotate(45 12 12)"/>
          <rect x="10.3" y="1.6" width="3.4" height="5" rx="1" transform="rotate(90 12 12)"/>
          <rect x="10.3" y="1.6" width="3.4" height="5" rx="1" transform="rotate(135 12 12)"/>
          <rect x="10.3" y="1.6" width="3.4" height="5" rx="1" transform="rotate(180 12 12)"/>
          <rect x="10.3" y="1.6" width="3.4" height="5" rx="1" transform="rotate(225 12 12)"/>
          <rect x="10.3" y="1.6" width="3.4" height="5" rx="1" transform="rotate(270 12 12)"/>
          <rect x="10.3" y="1.6" width="3.4" height="5" rx="1" transform="rotate(315 12 12)"/>
          <path fill-rule="evenodd" d="M12 4.9a7.1 7.1 0 1 0 0 14.2 7.1 7.1 0 1 0 0-14.2zm0 4.5a2.6 2.6 0 1 1 0 5.2 2.6 2.6 0 1 1 0-5.2z"/>
        </g>
      </svg>
      <em>SETTINGS</em>
    </button>

    <!-- Bet amount -->
    <button class="ctl small-btn bet" id="bet" aria-label="Bet amount">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
        <g fill="url(#goldGrad)" stroke="#8a4300" stroke-width=".7" stroke-linejoin="round">
          <path d="M4.5 15.5v3c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-3c0 1.7-3.4 3-7.5 3s-7.5-1.3-7.5-3z"/>
          <path d="M4.5 10.5v3c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-3c0 1.7-3.4 3-7.5 3s-7.5-1.3-7.5-3z"/>
          <path d="M4.5 5.5v3c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-3c0 1.7-3.4 3-7.5 3s-7.5-1.3-7.5-3z"/>
          <ellipse cx="12" cy="5.5" rx="7.5" ry="3"/>
          <ellipse cx="12" cy="5.5" rx="4.2" ry="1.4" fill="#ffe27a" stroke="none"/>
        </g>
      </svg>
      <em>BET</em>
    </button>

    <!-- Spin / Stop -->
    <button class="spin" id="spin" aria-label="Spin"><span>⟳</span></button>

    <!-- Auto spin -->
    <button class="ctl small-btn autoplay" id="autoplay" aria-label="Auto spin">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
        <g class="auto-arrows" fill="none" stroke="url(#goldGrad)" stroke-width="2.3" stroke-linecap="round">
          <path d="M20 12a8 8 0 0 1-13.6 5.7"/>
          <path d="M4 12a8 8 0 0 1 13.6-5.7"/>
        </g>
        <path d="M18.4 2.6v5.2h-5.2z" fill="url(#goldGrad)" stroke="#8a4300" stroke-width=".5" stroke-linejoin="round"/>
        <path d="M5.6 21.4v-5.2h5.2z" fill="url(#goldGrad)" stroke="#8a4300" stroke-width=".5" stroke-linejoin="round"/>
        <path d="M10 8.7v6.6l5.5-3.3z" fill="url(#goldGrad)" stroke="#8a4300" stroke-width=".6" stroke-linejoin="round"/>
      </svg>
      <em>AUTO</em>
      <b class="badge" id="autoCount" aria-hidden="true"></b>
    </button>

    <!-- Fast spin -->
    <button class="ctl side-btn fast" id="fast" aria-label="Fast spin">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
        <g class="chev" fill="url(#goldGrad)" stroke="#8a4300" stroke-width=".7" stroke-linejoin="round">
          <path d="M3.5 5.2l8 6.8-8 6.8z"/>
          <path d="M12.5 5.2l8 6.8-8 6.8z"/>
        </g>
      </svg>
      <em>FAST</em>
    </button>
  </div>
  <div class="status">
    <div class="level">♛<small>21</small></div>
    <div class="balance"><span aria-hidden="true">◆</span> ETB <b id="balance">0.64</b></div>
    <div class="bet-value">ETB <b id="betValue">10.00</b></div>
  </div>
  <div class="footer"><b>Hit Coins 2</b><time class="time" id="clock">--:--</time></div>
  <div class="toast" id="toast" role="status"></div>

  <!-- Full-page Hold & Spin bonus (own page + matching purple UI) -->
  <div class="bonus-page" id="bonusPage" hidden aria-hidden="true">
    <div class="bonus-bg"></div>
    <div class="bonus-jackpots">
      <div class="jp jp-grand"><span> </span><b> </b></div>
      <div class="jp jp-major"><span> </span><b> </b></div>
      <div class="jp jp-minor"><span> </span><b> </b></div>
      <div class="jp jp-mini"><span> </span><b> </b></div>
    </div>
    <div class="bonus-logo">
      <div class="coin-pile"> </div>
      <div class="logo-two"> </div>
      <div class="logo-title"> </div>
    </div>
    <div class="hold-frame">
      <div class="collector-board" id="collectorBoard">
        <div class="bonus-column" id="leftColumn"></div>
        <div class="bonus-column collector-column" id="midColumn"></div>
        <div class="bonus-column" id="rightColumn"></div>
      </div>
    </div>
    <div class="bonus-spin-info">
      <div class="respins-badge"><span class="respins-icon">⟳</span> <b id="respinsCount">3</b> RE-SPINS</div>
    </div>
    <div class="bonus-controls">
      <button type="button" class="bonus-speed-btn" id="bonusFastBtn" aria-label="Switch bonus spin speed" aria-pressed="false">NORMAL</button>
      <button type="button" class="bonus-spin-btn" id="bonusSpinBtn" aria-label="Spin bonus">
        <span class="bonus-spin-icon">⟳</span>
      </button>
    </div>
    <div class="bonus-footer">
      <span class="bonus-total">TOTAL <b id="bonusTotal">0</b></span>
      <button type="button" class="bonus-collect" id="bonusCollectBtn" hidden>COLLECT</button>
    </div>
  </div>
</main>
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script>window.HC2_SOCKET_URL = "https://keno-server-20g6.onrender.com";</script>
<script src="app.js"></script>
</body>
      </html>
